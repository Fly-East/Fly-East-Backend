name: Fly East CI/CD (VPS)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "✅ SSH connection successful!"
            whoami
            pwd
            ls -la

            # 1️⃣ Navigate to project
            cd /var/www/fly-east-backend

            # 2️⃣ Pull latest code safely
            echo "📦 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # 3️⃣ Install dependencies
            echo "📥 Installing dependencies..."
            pnpm install --frozen-lockfile

            # 4️⃣ Build the project (clean dist to avoid stale artifacts)
            echo "🛠 Building the project..."
            rm -rf dist
            pnpm build

            # 5️⃣ Restart PM2 process without deleting it (start if missing)
            echo "🔄 Restarting PM2 process..."
            if pm2 describe fly-east-backend >/dev/null 2>&1; then
              pm2 restart fly-east-backend --time --update-env
            else
              pm2 start dist/app.js \
                --name "fly-east-backend" \
                --cwd /var/www/fly-east-backend \
                --time
            fi

            pm2 save
